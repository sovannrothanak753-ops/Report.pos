<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Narith Master-IT · Report Plant</title>
<link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&family=Moul&family=Hanuman:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
:root{--bg:#bfe6fb;--pn:#fff;--ink:#1d1b1a;--mut:#6b6560;--ln:#cfe3f0;--rd:#c00000;--rd2:#ff5a3c;--sh:0 10px 30px rgba(14,100,160,.18);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#8fd3f4 0%,#c9ecfc 55%,#e6f6fe 100%) fixed;color:var(--ink);font:14px/1.5 'Battambang','Hanuman',system-ui,sans-serif;min-height:100vh}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:8px 14px;background:var(--ln);color:var(--ink);transition:transform .15s,box-shadow .2s,background .2s}
button:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(0,0,0,.15)}
button:active{transform:scale(.96)}
.pri{background:linear-gradient(135deg,var(--rd),var(--rd2));color:#fff}
.ghost{background:transparent;border:1px solid var(--ln)}
input,textarea,select{font:inherit;width:100%;padding:8px 10px;border:1px solid var(--ln);border-radius:9px;background:var(--pn);color:var(--ink);transition:border .2s,box-shadow .2s}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--rd);box-shadow:0 0 0 3px rgba(192,0,0,.15)}
textarea{resize:vertical}
/* login */
#login{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(120deg,#7a0000,#c00000,#ff5a3c,#c00000);background-size:300% 300%;animation:bg 12s ease infinite;overflow:hidden;z-index:50;padding:16px}
@keyframes bg{50%{background-position:100% 50%}}
.bl{position:absolute;border-radius:50%;background:rgba(255,255,255,.12);animation:fl 9s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-40px) scale(1.15)}}
.lc{position:relative;width:min(380px,100%);background:var(--pn);border-radius:22px;padding:30px 26px;box-shadow:0 30px 70px rgba(0,0,0,.4);animation:up .8s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{opacity:0;transform:translateY(40px) scale(.95)}}
.lc img{width:96px;height:96px;border-radius:50%;display:block;margin:-70px auto 10px;box-shadow:0 8px 24px rgba(0,0,0,.35);background:#fff;animation:pop 1s .3s both}
@keyframes pop{from{transform:scale(0) rotate(-90deg)}}
.lc h1{font:400 15px 'Moul',serif;text-align:center;color:var(--rd);margin:6px 0 2px}
.lc p{text-align:center;color:var(--mut);margin:0 0 16px;font-size:12px}
.lc label{display:block;margin-bottom:12px;font-size:12px;color:var(--mut)}
.shake{animation:sk .4s}
@keyframes sk{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
#err{color:var(--rd);min-height:20px;text-align:center;font-size:13px}
/* app */
#app{display:none;min-height:100vh;flex-direction:column}
#app.on{display:flex;animation:fi .6s}
@keyframes fi{from{opacity:0}}
.top{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--pn);border-bottom:1px solid var(--ln);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.top .lg{width:38px;height:38px;border-radius:50%;animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.top h2{font:400 13px 'Moul',serif;color:var(--rd);margin:0}
.top .sp{flex:1}
#cur{width:auto;max-width:220px}
.av{width:42px;height:42px;border-radius:50%;object-fit:cover;border:2px solid var(--rd);cursor:pointer;display:grid;place-items:center;background:linear-gradient(135deg,var(--rd),var(--rd2));color:#fff;font-weight:700;overflow:hidden;transition:transform .3s}
.av:hover{transform:rotate(8deg) scale(1.1)}
.av img{width:100%;height:100%;object-fit:cover}
.who{line-height:1.2;font-size:12px}.who b{display:block;font-size:13px}
.bar{display:flex;gap:8px;flex-wrap:wrap;padding:10px 16px}
.main{display:grid;grid-template-columns:minmax(340px,480px) 1fr;gap:16px;padding:0 16px 24px;flex:1;align-items:start}
#ed{background:var(--pn);border-radius:16px;box-shadow:var(--sh);padding:10px;max-height:calc(100vh - 150px);overflow:auto}
#pvw{overflow:auto;border-radius:16px;background:rgba(255,255,255,.35);padding:12px;max-height:calc(100vh - 150px)}
details{border:1px solid var(--ln);border-radius:12px;margin:8px 0;overflow:hidden}
summary{cursor:pointer;padding:10px 12px;font-weight:700;background:linear-gradient(90deg,rgba(14,165,233,.18),transparent);list-style:none}
summary::before{content:'▸ ';color:var(--rd);display:inline-block;transition:transform .2s}
details[open]>summary::before{transform:rotate(90deg)}
details>div{padding:10px;animation:dn .35s}
@keyframes dn{from{opacity:0;transform:translateY(-8px)}}
.f{display:block;margin-bottom:8px;font-size:12px;color:var(--mut)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cd{border:1px dashed var(--ln);border-radius:12px;padding:10px;margin-bottom:10px;background:rgba(192,0,0,.03);animation:dn .35s}
.cd .row{display:grid;grid-template-columns:90px 1fr 34px;gap:6px;align-items:start;margin-bottom:6px}
.x{background:rgba(192,0,0,.12);color:var(--rd);padding:6px 0}
.tabs{display:none}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,80px);background:#222;color:#fff;padding:10px 18px;border-radius:30px;transition:transform .35s;z-index:99}
#toast.on{transform:translate(-50%,0)}
/* document */
.sheet{width:1123px;min-height:794px;background:#fff;color:#000;margin:0 auto;transform-origin:top left;font:13px/1.45 'Battambang','Hanuman',serif;box-shadow:0 8px 30px rgba(0,0,0,.25);animation:fi .5s}
.sheet table{border-collapse:collapse}
.fr{width:100%}.fr>tbody>tr>td,.fr>thead>tr>td,.fr>tfoot>tr>td{padding:0}
.band{height:18px;background:#c00000}
.bd{padding:6px 44px 10px 44px!important}
.hd{display:flex;align-items:center;gap:20px;justify-content:center;margin:6px 0}
.hd .lg{width:92px;height:92px;border-radius:50%}
.ht{text-align:center}
.k1{font:400 17px 'Moul',serif;color:#c00000}.en{font-size:15px;letter-spacing:.5px}.k2{font:400 11px 'Moul',serif;color:#c00000;margin-top:3px}
.tt{font:400 20px 'Moul',serif;color:#f00;text-align:center;margin:10px 0}
.inf{margin:2px 0}.inf b{display:inline-block;min-width:80px;font-weight:400}
.sheet h3{font:400 14px 'Moul',serif;color:#f00;margin:14px 0 6px}.sheet h3 b{font:700 15px serif;color:#000;margin-right:8px}
.sheet td,.sheet th{border:1px solid #000;padding:3px 7px;vertical-align:middle}
.sheet th{font-weight:700;text-align:center}
.t{width:100%;table-layout:fixed}.c{text-align:center}
.sheet .gh th{background:#c00000;color:#fff}.sheet .ph th{background:#f8cbad}.sheet .fh th{background:#e8d5f5}.sheet .nh th{background:#c6e0b4}
.un td{background:#ffc000;border-color:#000}
.sheet tr{page-break-inside:avoid}
.ft{border-top:2px solid #c00000;padding:6px 44px;display:flex;justify-content:space-between;align-items:center;font-size:11px;gap:10px}
.fl{display:flex;gap:10px;align-items:center}.fl img{height:44px;border:1px solid #ccc}
.sheet a{color:#0563c1}
@media (max-width:860px){.main{grid-template-columns:1fr}.tabs{display:flex;gap:8px;padding:0 16px 10px}.v-pv #ed,.v-ed #pvw{display:none}.g2{grid-template-columns:1fr}}
@media print{
@page{size:A4 landscape;margin:0}
body{background:#fff;min-height:0}
#login,.top,.bar,.tabs,#ed,#toast{display:none!important}
#app,.main{display:block!important;padding:0!important}
#pvw{overflow:visible!important;max-height:none!important;padding:0!important;background:none!important}
.sheet{zoom:1!important;box-shadow:none!important;width:297mm;animation:none}
:root{padding:0}
*{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>

<div id="login">
<span class="bl" style="width:260px;height:260px;left:-60px;top:10%"></span><span class="bl" style="width:180px;height:180px;right:8%;top:60%;animation-delay:-3s"></span><span class="bl" style="width:120px;height:120px;left:30%;bottom:-30px;animation-delay:-6s"></span>
<div class="lc" id="lc"><img id="lgo" alt="logo">

<span style="flex:1"></span>
<button class="pri" id="epdf">⬇ PDF</button><button class="pri" id="edoc">⬇ Docx</button><button id="pr">🖨 Print</button><button id="ejs">{ } JSON</button><button id="ijs">⬆ Import JSON</button>
<input type="file" id="jf" accept=".json,application/json" hidden></div>
<div class="tabs"><button class="pri" data-v="v-ed">កែប្រែ</button><button data-v="v-pv">មើលឯកសារ</button></div>

</div>

$('#epdf').onclick=async()=>{toast('កំពុងបង្កើត PDF…');const h=document.createElement('div');h.style.cssText='position:absolute;left:0;top:0;z-index:-9;width:1123px;background:#fff';h.innerHTML=`<div class=sheet style="box-shadow:none;animation:none;margin:0">${doc(D())}</div>`;document.body.appendChild(h);

/* docx */
const X=E;
const run=(t,o={})=>String(t??'').split('\n').map((l,i)=>`<w:r><w:rPr><w:rFonts w:ascii="Century" w:hAnsi="Century" w:cs="${o.m?'Khmer OS Muol Light':'Khmer OS Battambang'}"/>${o.b?'<w:b/><w:bCs/>':''}${o.u?'<w:u w:val="single"/>':''}<w:color w:val="${o.c||'000000'}"/><w:sz w:val="${o.sz||21}"/><w:szCs w:val="${o.sz||21}"/></w:rPr>${i?'<w:br/>':''}<w:t xml:space="preserve">${X(l)}</w:t></w:r>`).join('');
const P=(t,o={})=>`<w:p><w:pPr>${o.kn?'<w:keepNext/>':''}<w:spacing w:before="${o.sb||0}" w:after="${o.sa||0}"/>${o.al?`<w:jc w:val="${o.al}"/>`:''}</w:pPr>${run(t,o)}</w:p>`;
const TC=(w,c,o={})=>`<w:tc><w:tcPr><w:tcW w:w="${w}" w:type="dxa"/>${o.gs?`<w:gridSpan w:val="${o.gs}"/>`:''}${o.vm?`<w:vMerge${o.vm==1?' w:val="restart"':''}/>`:''}${o.f?`<w:shd w:val="clear" w:color="auto" w:fill="${o.f}"/>`:''}<w:vAlign w:val="center"/></w:tcPr>${c}</w:tc>`;
const TR=c=>`<w:tr><w:trPr><w:cantSplit/></w:trPr>${c}</w:tr>`;
const TB=(W,rows,nb)=>`<w:tbl><w:tblPr><w:tblW w:w="${W.reduce((a,b)=>a+b)}" w:type="dxa"/><w:tblLayout w:type="fixed"/><w:tblBorders>${['top','left','bottom','right','insideH','insideV'].map(s=>`<w:${s} w:val="${nb?'nil':'single'}" w:sz="4" w:space="0" w:color="000000"/>`).join('')}</w:tblBorders><w:tblCellMar><w:left w:w="80" w:type="dxa"/><w:right w:w="80" w:type="dxa"/></w:tblCellMar></w:tblPr><w:tblGrid>${W.map(w=>`<w:gridCol w:w="${w}"/>`).join('')}</w:tblGrid>${rows}</w:tbl>`;
const DR=(rid,cx,cy,id)=>`<w:r><w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0"><wp:extent cx="${cx}" cy="${cy}"/><wp:docPr id="${id}" name="img${id}"/><a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:nvPicPr><pic:cNvPr id="${id}" name="i${id}"/><pic:cNvPicPr/></pic:nvPicPr><pic:blipFill><a:blip r:embed="${rid}"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill><pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r>`;
const NS='xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing"';
function mkDocx(d){
 const H=(t,f,W)=>t.map((x,i)=>TC(W[i],P(x,{b:1,al:'center',c:f=='C00000'?'FFFFFF':'000000'}),{f})).join('');
 const sec=(n,t)=>P('',{sa:0})+`<w:p><w:pPr><w:keepNext/><w:spacing w:before="200" w:after="80"/></w:pPr>${run(n+'  ',{b:1,sz:24})}${run(t,{m:1,c:'FF0000',sz:22})}</w:p>`;
 const W1=[600,3500,1300,5400,2000,2054];let g='';
 g+=TR(H(['N','គោលដៅប្រចាំខែនិមួយៗ','សម្រេចបាន','សកម្មភាពសម្រេចបាន','អ្នកទទួលខុសត្រូវ','វាយតម្លៃ'],'C00000',W1));
 d.goals.forEach((o,i)=>{const L=o.lines.length?o.lines:[{v:'',t:''}];L.forEach((l,j)=>{const a=j?2:1;g+=TR((j?TC(W1[0],P(''),{vm:2})+TC(W1[1],P(''),{vm:2}):TC(W1[0],P(o.n||i+1,{al:'center'}),{vm:L.length>1?1:0})+TC(W1[1],P(o.goal),{vm:L.length>1?1:0}))+TC(W1[2],P(l.v,{al:'center'}))+TC(W1[3],P(l.t))+(j?TC(W1[4],P(''),{vm:2})+TC(W1[5],P(''),{vm:2}):TC(W1[4],P(o.owner,{al:'center',u:!!o.url,c:o.url?'0563C1':'000000'}),{vm:L.length>1?1:0})+TC(W1[5],P(o.rating,{al:'center'}),{vm:L.length>1?1:0})))})});
 g+=TR(TC(14854,P(d.unTitle,{b:1}),{gs:6,f:'FFC000'}));
 d.un.forEach((u,i)=>g+=TR(TC(W1[0],P(i+1,{al:'center'}))+TC(W1[1],P(u.goal))+TC(W1[2],P(u.v,{al:'center'}))+TC(W1[3],P(u.t))+TC(W1[4],P(u.owner,{al:'center'}))+TC(W1[5],P(u.rating,{al:'center'}))));
 const W2=[600,5200,5400,3654];let p=TR(H(['N','សកម្មភាព','ដំណោះស្រាយ','អ្នកទទួលខុសត្រូវ'],'F8CBAD',W2));
 d.pr.forEach((x,i)=>p+=TR(TC(W2[0],P(i+1,{al:'center'}))+TC(W2[1],P(x.a))+TC(W2[2],P(x.s))+TC(W2[3],P(x.o,{al:'center'}))));
 const W3=[600,14254];let f=TR(H(['N','មតិយោបល់ និងសំណូមពរ'],'E8D5F5',W3));
 d.fb.forEach((x,i)=>f+=TR(TC(W3[0],P(i+1,{al:'center'}))+TC(W3[1],P(x))));
 const W4=[600,11200,3054];let n=TR(H(['N','គោលដៅប្រចាំខែថ្មី','អ្នកទទួលខុសត្រូវ'],'C6E0B4',W4));
 d.ng.forEach((x,i)=>n+=TR(TC(W4[0],P(i+1,{al:'center',b:1}))+TC(W4[1],P(x.g,{b:1}))+TC(W4[2],P(x.o,{al:'center',b:1}))));
 const head=TB([1700,13154],TR(TC(1700,`<w:p>${DR('rIdL',900000,900000,1)}</w:p>`)+TC(13154,P(d.co.kh,{m:1,c:'C00000',sz:30,al:'center'})+P(d.co.en,{sz:26,al:'center'})+P(d.co.tag,{m:1,c:'C00000',sz:18,al:'center'}))),1);
 const band=`<w:p><w:pPr><w:shd w:val="clear" w:color="auto" w:fill="C00000"/><w:spacing w:before="0" w:after="60" w:line="240" w:lineRule="exact"/></w:pPr>${run(' ',{sz:12})}</w:p>`;
 const info=[['ឈ្មោះ',d.name],['ចាប់ផ្តើម',d.start+' ដល់ '+d.end],['មុខតំណែង',d.pos],['ផ្នែក',d.dept]].map(([a,b])=>`<w:p><w:pPr><w:spacing w:after="20"/></w:pPr>${run(a+'   ',{})}${run(b,{})}</w:p>`).join('');
 const body=band+head+P(d.title,{m:1,c:'FF0000',sz:36,al:'center',sb:120,sa:120})+info+sec('I.','លទ្ធផលសម្រេចលើផែនការគោលដៅប្រចាំខែ')+TB(W1,g)+sec('II.','បញ្ហាជួបប្រទះ')+TB(W2,p)+sec('III.','មតិយោបល់ និងសំណូមពរ')+TB(W3,f)+sec('IV.','ផែនការគោលដៅប្រចាំខែថ្មី')+TB(W4,n)+P('');
 const sect='<w:sectPr><w:footerReference w:type="default" r:id="rIdF"/><w:pgSz w:w="16839" w:h="11907" w:orient="landscape"/><w:pgMar w:top="567" w:right="851" w:bottom="1500" w:left="1134" w:header="400" w:footer="250" w:gutter="0"/></w:sectPr>';
 const fld=c=>`<w:r><w:fldChar w:fldCharType="begin"/></w:r><w:r><w:instrText xml:space="preserve"> ${c} </w:instrText></w:r><w:r><w:fldChar w:fldCharType="separate"/></w:r><w:r><w:t>1</w:t></w:r><w:r><w:fldChar w:fldCharType="end"/></w:r>`;
 const pic=IMG.f.map((_,i)=>DR('rIdF'+i,420000,420000,10+i)+'<w:r><w:t xml:space="preserve">  </w:t></w:r>').join('');
 const foot=`<w:ftr ${NS}><w:p><w:pPr><w:pBdr><w:top w:val="single" w:sz="12" w:space="2" w:color="C00000"/></w:pBdr><w:spacing w:after="0"/></w:pPr>${run(d.ft.addr,{sz:15})}</w:p>${P(d.ft.email,{sz:15})}<w:p><w:pPr><w:tabs><w:tab w:val="right" w:pos="14854"/></w:tabs><w:spacing w:after="0"/></w:pPr>${run(d.ft.tel,{sz:15})}<w:r><w:tab/></w:r>${pic}<w:r><w:t xml:space="preserve">Page </w:t></w:r>${fld('PAGE')}<w:r><w:t xml:space="preserve"> | </w:t></w:r>${fld('NUMPAGES')}</w:p></w:ftr>`;
 return{doc:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document ${NS}><w:body>${body}${sect}</w:body></w:document>`,foot};}
async function docx(){const d=D(),z=new JSZip(),m=mkDocx(d),R='http://schemas.openxmlformats.org/officeDocument/2006/relationships';
 const ext=s=>s.startsWith('data:image/png')?'png':'jpeg',b64=s=>s.split(',')[1];
 z.file('[Content_Types].xml','<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Default Extension="png" ContentType="image/png"/><Default Extension="jpeg" ContentType="image/jpeg"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/footer1.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.footer+xml"/></Types>');
 z.file('_rels/.rels',`<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="${R}/officeDocument" Target="word/document.xml"/></Relationships>`);
 z.file('word/document.xml',m.doc);z.file('word/footer1.xml',m.foot);
 const rel=(id,t,tg)=>`<Relationship Id="${id}" Type="${R}/${t}" Target="${tg}"/>`;
 z.file('word/_rels/document.xml.rels',`<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${rel('rIdL','image','media/logo.'+ext(LG()))}${rel('rIdF','footer','footer1.xml')}</Relationships>`);
 z.file('word/media/logo.'+ext(LG()),b64(LG()),{base64:true});
 z.file('word/_rels/footer1.xml.rels',`<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${IMG.f.map((s,i)=>rel('rIdF'+i,'image','media/f'+i+'.'+ext(s))).join('')}</Relationships>`);
 IMG.f.forEach((s,i)=>z.file('word/media/f'+i+'.'+ext(s),b64(s),{base64:true}));
 return z.generateAsync({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'})}
